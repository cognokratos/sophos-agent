services:
  web:
    build:
      context: ..
      dockerfile: infra/app/Dockerfile
    ports:
      - '5173:5173'
    env_file: '.env'
    environment:
      - PORT=5173
    volumes:
      - ./app/config:/app/config
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173/api/healthz']
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-memory:
    build:
      context: mcp/memory
      dockerfile: Dockerfile
    ports:
      - '8081:8080'
    volumes:
      - ../data/memory:/data/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/ping']
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-fetch:
    build:
      context: mcp/fetch
      dockerfile: Dockerfile
    ports:
      - '8082:8080'
    volumes:
      - ../data/fetch:/data/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/status']
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    restart: unless-stopped
    ports:
      - '6274:6274' # Inspector UI
      - '6277:6277' # MCP Proxy
    environment:
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://0.0.0.0:6274
